<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Pomodoro Lo-fi</title>
<style>
  /* janelinha transparente: só o bichinho, o tempo e dois botõezinhos. Arrasta pelo bichinho ou pelo tempo */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px; padding-bottom: 6px; box-sizing: border-box; font-family: "Segoe UI", system-ui, sans-serif; --cor: #F4B86A; }
  body[data-mode="short"], body[data-mode="long"] { --cor: #9AD3B0; }
  #arrasta { -webkit-app-region: drag; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: grab; }
  #pet { width: 104px; height: 104px; image-rendering: pixelated; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .5)); }
  #time { font-weight: 800; font-size: 27px; line-height: 1; font-variant-numeric: tabular-nums; color: #F4EFE6; background: rgba(21, 19, 31, .9); border: 2px solid var(--cor); border-radius: 999px; padding: 5px 16px 6px; }
  #botoes { display: flex; gap: 6px; }
  button { width: 30px; height: 26px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .25); background: rgba(21, 19, 31, .85); color: #F4EFE6; font: 700 13px "Segoe UI", sans-serif; cursor: pointer; padding: 0; }
  button:hover { border-color: var(--cor); color: var(--cor); }
  /* balão do lembrete de água: aparece em cima do bichinho e ele dá uns pulinhos para chamar atenção */
  #agua { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 134px; box-sizing: border-box; padding: 8px 6px; margin-bottom: 2px; border-radius: 14px; background: rgba(21, 19, 31, .94); border: 2px solid #8CC8F4; color: #F4EFE6; font-size: 12px; font-weight: 700; text-align: center; line-height: 1.2; }
  #agua[hidden] { display: none; }
  #agua div { display: flex; gap: 5px; }
  #agua button { width: auto; height: 24px; padding: 0 9px; font-size: 11.5px; }
  #agua #wy { background: #8CC8F4; color: #15131F; border-color: #8CC8F4; }
  body.agua #pet { animation: pulo .55s ease-in-out infinite alternate; }
  @keyframes pulo { from { transform: translateY(0); } to { transform: translateY(-7px); } }
</style>
</head>
<body data-mode="focus">
  <div id="agua" hidden>
    <span>💧 hora de beber água!</span>
    <div><button id="wy" type="button">bebi!</button><button id="wl" type="button">depois</button></div>
  </div>
  <div id="arrasta">
    <img id="pet" alt="" draggable="false">
    <div id="time">--:--</div>
  </div>
  <div id="botoes">
    <button id="tg" type="button" title="começar ou pausar">⏯</button>
    <button id="bk" type="button" title="voltar para a janela grande">⤢</button>
  </div>
<script>
  const $ = id => document.getElementById(id);
  bichinho.aoReceber(d => {
    $('time').textContent = d.t;
    if (d.img && $('pet').src !== d.img) $('pet').src = d.img;
    document.body.dataset.mode = d.mode;
    $('agua').hidden = !d.agua; document.body.classList.toggle('agua', !!d.agua);
  });
  $('wy').onclick = () => bichinho.agua(true);
  $('wl').onclick = () => bichinho.agua(false);
  $('tg').onclick = () => bichinho.comecarOuPausar();
  $('bk').onclick = () => bichinho.voltar();
</script>
</body>
</html>
