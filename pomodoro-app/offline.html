<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pomodoro Lo-fi</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #15131F; color: #F4EFE6; font: 16px/1.5 system-ui, "Segoe UI", sans-serif; text-align: center; }
  main { padding: 24px; max-width: 420px; }
  .t { font-size: 64px; }
  h1 { font-size: 22px; margin: 8px 0; }
  p { color: #B9B2C9; margin: 0 0 20px; }
  body::before { content: ""; position: fixed; top: 0; left: 0; right: 140px; height: 30px; -webkit-app-region: drag; }
  button { font: inherit; font-weight: 700; color: #15131F; background: #F4B86A; border: 0; border-radius: 999px; padding: 12px 26px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="t">🍅</div>
  <h1>sem internet agora</h1>
  <p>na primeira vez o pomodoro precisa de internet para abrir. depois disso ele funciona mesmo sem conexão.</p>
  <button onclick="location.href='https://pomodoro-lofi.web.app/'">tentar de novo</button>
</main>
</body>
</html>
